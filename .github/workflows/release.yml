name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Build Tools (zstd, zip, upx)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd zip upx

      - name: Compile 4 Core Platforms
        run: |
          mkdir -p dist

          echo "[1/4] Compiling Linux PC (amd64)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/termchat-linux-amd64 .
          upx --best --lzma dist/termchat-linux-amd64 || true
          tar --zstd -cvf dist/termchat-linux-amd64.tar.zst -C dist termchat-linux-amd64

          echo "[2/4] Compiling Windows 64-bit (amd64)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/termchat-windows.exe .
          zip -j dist/termchat-windows.zip dist/termchat-windows.exe

          echo "[3/4] Compiling Android Termux (arm64)..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o dist/termchat-android-arm64 .
          tar --zstd -cvf dist/termchat-android-arm64.tar.zst -C dist termchat-android-arm64

          echo "[4/4] Compiling macOS Apple Silicon (arm64)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/termchat-mac-apple-silicon .
          tar --zstd -cvf dist/termchat-mac-apple-silicon.tar.zst -C dist termchat-mac-apple-silicon

          echo "[CHECKSUMS] Generating SHA256 checksums..."
          cd dist
          sha256sum termchat-linux-amd64.tar.zst termchat-windows.zip termchat-android-arm64.tar.zst termchat-mac-apple-silicon.tar.zst > checksums.txt
          cd ..

          ls -lh dist/

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termchat-linux-amd64.tar.zst
            dist/termchat-windows.zip
            dist/termchat-android-arm64.tar.zst
            dist/termchat-mac-apple-silicon.tar.zst
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
