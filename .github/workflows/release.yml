name: Release TermChat

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Build Tools (zstd, zip, upx)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd zip upx python3-pip

      - name: Compile 4 Core Platforms
        run: |
          mkdir -p dist

          echo "[1/4] Compiling Linux PC (amd64)..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/termchat-linux-amd64 .
          upx -1 dist/termchat-linux-amd64 || true
          tar --zstd -cvf dist/termchat-linux-amd64.tar.zst -C dist termchat-linux-amd64

          echo "[2/4] Compiling Windows 64-bit (amd64)..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/termchat-windows.exe .
          zip -j dist/termchat-windows.zip dist/termchat-windows.exe

          echo "[3/4] Compiling Android Termux (arm64)..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o dist/termchat-android-arm64 .
          tar --zstd -cvf dist/termchat-android-arm64.tar.zst -C dist termchat-android-arm64

          echo "[4/4] Compiling macOS Apple Silicon (arm64)..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/termchat-mac-apple-silicon .
          tar --zstd -cvf dist/termchat-mac-apple-silicon.tar.zst -C dist termchat-mac-apple-silicon

          echo "[CHECKSUMS] Generating SHA256 checksums..."
          cd dist
          sha256sum termchat-linux-amd64.tar.zst termchat-windows.zip termchat-android-arm64.tar.zst termchat-mac-apple-silicon.tar.zst > checksums.txt
          cd ..

          echo "[DELTA] Generating Chrome-style Differential Binary Delta Patches..."
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(gh release list --limit 2 --json tagName --jq '.[1].tagName' || true)

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "null" ]; then
            echo "Previous release tag detected: $PREV_TAG -> Current: $CURRENT_TAG"
            mkdir -p prev
            gh release download "$PREV_TAG" -D prev || true

            # Extract previous binaries if archives
            if [ -f "prev/termchat-linux-amd64.tar.zst" ]; then
              tar --zstd -xvf prev/termchat-linux-amd64.tar.zst -C prev/ || true
            fi
            if [ -f "prev/termchat-android-arm64.tar.zst" ]; then
              tar --zstd -xvf prev/termchat-android-arm64.tar.zst -C prev/ || true
            fi
            if [ -f "prev/termchat-mac-apple-silicon.tar.zst" ]; then
              tar --zstd -xvf prev/termchat-mac-apple-silicon.tar.zst -C prev/ || true
            fi
            if [ -f "prev/termchat-windows.zip" ]; then
              unzip -o prev/termchat-windows.zip -d prev/ || true
            fi

            # Build host delta generator tool
            go build -o /tmp/termchat-delta .

            # Generate delta patches
            if [ -f "prev/termchat-linux-amd64" ] && [ -f "dist/termchat-linux-amd64" ]; then
              /tmp/termchat-delta delta prev/termchat-linux-amd64 dist/termchat-linux-amd64 dist/termchat-linux-amd64-${PREV_TAG}-to-${CURRENT_TAG}.delta.zst || true
            fi
            if [ -f "prev/termchat-android-arm64" ] && [ -f "dist/termchat-android-arm64" ]; then
              /tmp/termchat-delta delta prev/termchat-android-arm64 dist/termchat-android-arm64 dist/termchat-android-arm64-${PREV_TAG}-to-${CURRENT_TAG}.delta.zst || true
            fi
            if [ -f "prev/termchat-mac-apple-silicon" ] && [ -f "dist/termchat-mac-apple-silicon" ]; then
              /tmp/termchat-delta delta prev/termchat-mac-apple-silicon dist/termchat-mac-apple-silicon dist/termchat-mac-apple-silicon-${PREV_TAG}-to-${CURRENT_TAG}.delta.zst || true
            fi
            if [ -f "prev/termchat-windows.exe" ] && [ -f "dist/termchat-windows.exe" ]; then
              /tmp/termchat-delta delta prev/termchat-windows.exe dist/termchat-windows.exe dist/termchat-windows.exe-${PREV_TAG}-to-${CURRENT_TAG}.delta.zst || true
            fi
          fi

          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/termchat-linux-amd64.tar.zst
            dist/termchat-windows.zip
            dist/termchat-android-arm64.tar.zst
            dist/termchat-mac-apple-silicon.tar.zst
            dist/checksums.txt
            dist/*.delta.zst
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to Hugging Face Cloudflare Global CDN
        if: ${{ env.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --upgrade huggingface_hub
          python3 -c "
          import os
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          if token:
              api = HfApi(token=token)
              user_info = api.whoami()
              username = user_info.get('name', 'BrianC0des')
              repo_id = f'{username}/termchat-releases'
              print(f'Syncing to Hugging Face repo: {repo_id}')
              try:
                  api.create_repo(repo_id=repo_id, repo_type='dataset', private=False, exist_ok=True)
              except Exception as e:
                  print(f'HF Repo check: {e}')
              api.upload_folder(
                  folder_path='dist',
                  repo_id=repo_id,
                  repo_type='dataset'
              )
              print(f'Successfully published to https://huggingface.co/datasets/{repo_id}!')
          "
